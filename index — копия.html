<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>3D модель</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
    #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.12, 0.12, 0.12, 1);

    const camera = new BABYLON.ArcRotateCamera(
      "cam", Math.PI / 2, Math.PI / 2.5, 5, BABYLON.Vector3.Zero(), scene
    );
    camera.attachControl(canvas, true);

    // Вращение: левая кнопка (и один палец на телефоне)
    camera.angularSensibilityX = 1000;
    camera.angularSensibilityY = 1000;

    // Перемещение: правая кнопка мыши или Ctrl + левая; два пальца на телефоне
    camera.panningSensibility = 50;
    camera.panningDistanceLimit = null;
    camera.inputs.attached.pointers.buttons = [0, 1, 2]; // 0 - вращение, 1 - зум, 2 - панорама
    camera.inputs.attached.pointers.panningMouseButton = 2;

    // Масштабирование колесом: чем меньше значение, тем быстрее зум
    camera.wheelPrecision = 2;
    camera.pinchPrecision = 20;
    camera.lowerRadiusLimit = 0.01;

    new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

    BABYLON.SceneLoader.Append("./", "1172_Otradnoe_KPT-87-1.glb", scene, () => {
      // Вычисляем границы всех мешей модели
      let min = new BABYLON.Vector3(Infinity, Infinity, Infinity);
      let max = new BABYLON.Vector3(-Infinity, -Infinity, -Infinity);
      scene.meshes.forEach(mesh => {
        if (!mesh.isVisible || mesh.getTotalVertices() === 0) return;
        mesh.computeWorldMatrix(true);
        const bb = mesh.getBoundingInfo().boundingBox;
        min = BABYLON.Vector3.Minimize(min, bb.minimumWorld);
        max = BABYLON.Vector3.Maximize(max, bb.maximumWorld);
      });

      const center = BABYLON.Vector3.Center(min, max);
      const size = max.subtract(min);
      const radius = size.length() / 2;

      camera.setTarget(center);
      camera.radius = radius * 2.2;   // отступ, чтобы модель целиком попадала в кадр
      camera.lowerRadiusLimit = radius * 0.05;
      camera.upperRadiusLimit = radius * 10;
      camera.minZ = radius / 100;
      camera.maxZ = radius * 100;
    });

    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
